name: Pair case
description: Register one pair's business case and keep its semester outputs together
title: "[Pair] CASE-SLUG — business workflow and risk question"
labels: [pair-case, research]
body:
  - type: markdown
    attributes:
      value: |
        One member creates this issue for the team, once for the semester, and links it in #3. The default is a pair; if the instructor adapts team size, name all members and use the same workflow. Keep shared outputs in the checklist below; each member links their own Individual tasks here. Reuse this case for the proposal, presentations, analysis and report. Start small and refine with peer feedback; no instructor sign-off or appointed mentor is required. The instructor may adapt scope, pairings and timing. Use the [case guide](https://github.com/zhongnz/Fall26VIP_Agentic_Risk/blob/main/docs/studies/README.md). No platform or paid access is assumed.
  - type: input
    id: partners
    attributes:
      label: Partners and peer feedback
      description: Name both GitHub usernames, or all members if course direction adapts team size. Add peer reviewers when arranged; an unassigned reviewer does not block starting.
      placeholder: "@PARTNER-ONE and @PARTNER-TWO; peer feedback to be arranged."
    validations:
      required: true
  - type: textarea
    id: outline
    attributes:
      label: Short case outline
      description: Half a page is enough. Choose a real business use case for an agentic workflow, one risk question and a possible improvement to assess. Propagation is optional. Link your case document when available rather than maintaining two copies.
      value: |
        - Business workflow and source:
        - One risk question / possible improvement:
        - Relevant prior work:
        - Evidence and comparison:
        - Feasibility, help needed, and next individual roles:
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Individual tasks and roles
      description: Link each student's own tasks as agreed. Keep completed and open links, including individual report tasks and any optional starter work. Each task identifies its assessment category; a shared artifact must say who did what.
  - type: textarea
    id: checkpoints
    attributes:
      label: Working checkpoints
      description: Keep output links beside these checkpoints and adapt targets to course direction. If you cannot edit this issue, comment with your update; its author or a maintainer can update the checklist. Register once in #3; cohort collections refer here. Use M5 for this semester-long issue. This is not an approval checklist.
      value: |
        - [ ] M2 Oct 9 — partners, short outline, accessible evidence route and next tasks recorded
        - [ ] M3 Oct 16 — midterm slides/feedback linked (#21); dated method and feasibility check linked (#7)
        - [ ] During evidence work — evaluation rules recorded before use; exploratory work and later changes identified
        - [ ] M4 Oct 30 — first checked analysis, failures and limitations linked (#8)
        - [ ] Nov 6 — pair report draft and each member's individual report draft linked
        - [ ] M5 Nov 20 — reviewed report/evidence and peer handoff check linked (#9)
        - [ ] M5 Nov 20 — final presentation and feedback linked (#22)
        - [ ] M5 Nov 20 — each student's individual report task linked (#23)
        - [ ] Each member's contributions reviewed; report index updated; remaining work recorded
  - type: textarea
    id: evidence
    attributes:
      label: Method, evidence, feedback, and changes
      description: Link the dated working method and available peer feedback. Record what changed, why, and whether results had been inspected. Routine refinements need no instructor sign-off.
